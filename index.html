  --foco:0 0 0 2px var(--off),0 0 0 4px var(--vinho);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);font-size:16px;line-height:1.5;color:var(--ameixa);background:var(--off);-webkit-font-smoothing:antialiased;min-height:100vh}
/* trava de rolagem que não faz a página pular para o topo no iPhone */
body.travado{position:fixed;left:0;right:0;width:100%;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
/* C2: um único estilo de foco em todos os controles */
:focus{outline:none}
:focus-visible{outline:none;box-shadow:var(--foco)}
svg{display:block;flex-shrink:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tab{font-variant-numeric:tabular-nums lining-nums}
mark{background:var(--suave);color:inherit;border-radius:3px;padding:0 1px}

.app{max-width:600px;margin:0 auto;padding:calc(28px + var(--st)) 20px calc(40px + var(--sb))}
@media (min-width:380px){.app{padding-left:24px;padding-right:24px}}

/* ── PERFIL ── */
.perfil{display:flex;align-items:center;gap:14px}
.foto{position:relative;width:78px;height:78px;flex-shrink:0}
.foto svg{position:absolute;inset:0}
.foto img{position:absolute;left:9px;top:9px;width:60px;height:60px;border-radius:50%;object-fit:cover;object-position:50% 22%}
.perfil h1{font-family:var(--serif);font-size:21px;font-weight:500;line-height:1.2}
.perfil p{font-size:15px;color:var(--ameixa-70);margin-top:2px}

/* ── PESO (A4, B6) ── */
.peso{margin-top:22px;background:var(--branco);border:1.5px dashed var(--suave);border-radius:var(--r-md);padding:14px 12px 12px;transition:border-color .2s,background .2s}
.peso[data-estado="ok"]{border-style:solid;border-color:var(--traco)}
.peso[data-estado="fora"]{border-style:solid;border-color:var(--alerta);background:var(--alerta-bg)}
.peso-lbl{display:block;text-align:center;font-size:15px;font-weight:500;color:var(--ameixa-70)}
.peso-linha{display:flex;align-items:center;gap:8px;margin-top:2px}
.passo{width:48px;height:48px;border-radius:50%;border:1px solid var(--suave);background:var(--branco);color:var(--vinho);display:grid;place-items:center;flex-shrink:0;transition:background .15s,transform .1s}
.passo:active{background:var(--nevoa);transform:scale(.94)}
.passo.p44{width:44px;height:44px}
.peso-valor{flex:1;min-width:0;display:flex;align-items:baseline;justify-content:center;gap:6px;cursor:text}
.peso-input{font-family:var(--sans);font-size:44px;font-weight:600;line-height:1.1;letter-spacing:-.02em;color:var(--ameixa);background:transparent;border:0;outline:0;text-align:right;min-width:1ch;max-width:100%;padding:0;font-variant-numeric:tabular-nums;border-radius:8px}
.peso-input::placeholder{color:var(--ameixa-70);opacity:1}
.peso-un{font-size:22px;font-weight:600}
.peso-ajuda{display:flex;align-items:flex-start;justify-content:center;gap:8px;margin-top:6px;font-size:14px;line-height:1.4;color:var(--ameixa-70);text-align:center}
.peso-ajuda svg{margin-top:1px}
.peso[data-estado="ok"] .peso-ajuda{color:var(--vinho);font-weight:500}
.peso[data-estado="fora"] .peso-ajuda{color:var(--alerta);font-weight:600}
.peso[data-estado="fora"] .peso-input{color:var(--alerta)}

/* barra compacta ao rolar */
.barra{position:fixed;left:0;right:0;top:0;z-index:30;background:var(--off);border-bottom:1px solid var(--linha);padding-top:var(--st);transform:translateY(-102%);transition:transform .25s var(--ease);visibility:hidden}
.barra.on{transform:none;visibility:visible}
.barra.fora{background:var(--alerta-bg);border-bottom-color:var(--alerta)}
.barra-in{max-width:600px;margin:0 auto;height:64px;padding:0 16px 0 24px;display:flex;align-items:center;gap:10px}
.barra-peso{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;line-height:1.2;border-radius:8px}
.barra-peso small{font-size:13px;font-weight:500;color:var(--ameixa-70)}
.barra.fora .barra-peso small{color:var(--alerta);font-weight:600}
.barra-peso b{font-size:22px;font-weight:600}
.barra-peso b span{font-size:15px;margin-left:4px}
.barra-peso b.vazio{font-size:16px;font-weight:500;color:var(--ameixa-70)}

/* ── BUSCA E FILTROS (B4) ── */
.busca{position:relative;margin-top:18px}
.busca input{width:100%;height:52px;padding:0 48px 0 46px;border-radius:var(--r-sm);border:1px solid var(--linha);background:var(--branco);font-size:16px;outline:0;-webkit-appearance:none;appearance:none;transition:border-color .15s}
.busca input::placeholder{color:var(--ameixa-70);opacity:1}
.busca input:focus{border-color:var(--traco)}
.busca input::-webkit-search-cancel-button{display:none}
.busca .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ameixa-70);pointer-events:none}
.busca .limpar{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;display:none;place-items:center;color:var(--ameixa-70)}
.busca .limpar.on{display:grid}

.filtros-wrap{position:relative;margin:14px -20px 0}
@media (min-width:380px){.filtros-wrap{margin:14px -24px 0}}
.filtros-wrap::after{content:'';position:absolute;top:0;right:0;width:44px;height:100%;background:linear-gradient(90deg,rgba(255,250,248,0),var(--off));pointer-events:none;transition:opacity .2s}
.filtros-wrap.fim::after{opacity:0}
.filtros{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:3px 24px}
.filtros::-webkit-scrollbar{display:none}
.filtro{flex-shrink:0;height:44px;padding:0 15px;border-radius:999px;border:1px solid var(--linha);background:var(--branco);font-size:15px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:background .15s,color .15s}
.filtro small{font-size:14px;color:var(--ameixa-70);font-weight:500}
.filtro svg{display:none}
.filtro[aria-pressed="true"]{background:var(--ameixa);border-color:var(--ameixa);color:#fff;padding-left:11px;font-weight:600}
.filtro[aria-pressed="true"] svg{display:block}
.filtro[aria-pressed="true"] small{color:var(--suave)}

.contagem{margin-top:16px;font-size:15px;color:var(--ameixa-70)}
.contagem b{color:var(--ameixa);font-weight:600}

/* ── LISTA ── */
.faixa{display:flex;gap:10px;align-items:flex-start;margin-top:20px;padding:12px 14px;border-radius:var(--r-sm);font-size:15px;line-height:1.45;background:var(--neutro)}
.faixa svg{margin-top:1px}
.faixa.fora{background:var(--alerta-bg);color:var(--alerta);font-weight:500}
.grupo{margin-top:26px}
.grupo h2{display:flex;align-items:baseline;gap:8px;padding:0 4px 8px;font-family:var(--serif);font-size:21px;font-weight:500;line-height:1.25}
.grupo h2 svg{align-self:center;color:var(--traco)}
.grupo h2 small{font-family:var(--sans);font-size:15px;font-weight:500;color:var(--ameixa-70)}
.caixa{list-style:none;background:var(--branco);border-radius:var(--r-md);overflow:hidden;box-shadow:0 0 0 1px var(--linha)}
.caixa li+li .item{border-top:1px solid var(--linha)}
.item{width:100%;display:flex;flex-direction:column;align-items:stretch;gap:12px;padding:16px;text-align:left;transition:background .12s;border-radius:0}
.item:active{background:var(--neutro)}
.item:focus-visible{box-shadow:inset 0 0 0 2px var(--vinho)}
.item-topo{display:flex;align-items:flex-start;gap:12px}
.item-txt{flex:1;min-width:0}
.item-nome{font-size:17px;font-weight:600;line-height:1.3}
.item-apres{font-size:15px;color:var(--ameixa-70);line-height:1.4;margin-top:1px}
.item .chev{color:var(--ameixa-70);margin-top:2px}
.item-freq{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:14px;color:var(--ameixa-70)}

/* bloco de dados (B1): agrupado pela cor, sem bordas */
.dados{border-radius:14px;background:var(--nevoa);padding:12px 14px}
.dados-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.dados-col{min-width:0}
.dados-lbl{font-size:13px;font-weight:600;color:var(--ameixa-70);line-height:1.3}
.dados-val{display:flex;align-items:baseline;gap:4px;margin-top:2px;flex-wrap:wrap}
.dados-val b{font-size:22px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.dados-val span{font-size:15px;font-weight:600;color:var(--vinho)}
.dados-col.d24 .dados-val b{font-size:18px}
.dados-sub{display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:3px;font-size:14px;font-variant-numeric:tabular-nums;line-height:1.35}
.dados-pe{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;margin-top:12px;font-size:14px;line-height:1.35}
.dados-pe .f{display:flex;align-items:center;gap:6px;flex:1 1 100%;min-width:0}
.dados-pe .f svg{color:var(--vinho)}
.marca{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;padding:3px 8px 3px 6px;border-radius:999px;background:var(--branco)}
.marca.atencao{color:var(--atencao)}
.marca.info{color:var(--info)}
.dados.fixo .txt{font-size:15px;font-weight:600;line-height:1.4;margin-top:2px}

.vazio{margin-top:26px;background:var(--branco);border-radius:var(--r-md);box-shadow:0 0 0 1px var(--linha);padding:28px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.vazio svg{color:var(--ameixa-70)}
.btn-sec{height:44px;padding:0 18px;border-radius:var(--r-sm);border:1px solid var(--suave);background:var(--branco);color:var(--vinho);font-size:15px;font-weight:600}

.rodape{margin-top:30px;font-size:14px;line-height:1.55;color:var(--ameixa-70);text-align:center;padding:0 8px}

/* ── PAINEL DE RESULTADO ── */
.veu{position:fixed;left:0;right:0;top:-120px;bottom:-120px;z-index:40;background:rgba(56,38,48,.42);opacity:0;pointer-events:none;transition:opacity .25s}
.veu.on{opacity:1;pointer-events:auto}
.folha{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:calc(100dvh - 32px - var(--st));display:flex;flex-direction:column;background:var(--branco);border-radius:var(--r-lg) var(--r-lg) 0 0;box-shadow:var(--sombra);transform:translateY(105%);transition:transform .34s var(--ease);visibility:hidden}
.folha.on{transform:none;visibility:visible}
.folha-topo{flex-shrink:0;padding:10px 20px 0;touch-action:none}
.alca{width:40px;height:5px;border-radius:3px;background:var(--suave);margin:0 auto 12px}
.folha-cab{display:flex;align-items:flex-start;gap:12px}
.folha-cab div{flex:1;min-width:0}
.folha-cab h2{font-family:var(--serif);font-size:26px;font-weight:500;line-height:1.2}
.folha-cab p{font-size:15px;color:var(--ameixa-70);margin-top:2px;line-height:1.4}
.fechar{width:44px;height:44px;border-radius:50%;background:var(--neutro);display:grid;place-items:center;flex-shrink:0;margin-top:-2px}
.folha-corpo{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:16px 20px 20px;display:flex;flex-direction:column;gap:14px}
.folha-corpo>*{flex-shrink:0}
/* A7: ações presas ao rodapé do painel */
.folha-acoes{flex-shrink:0;display:flex;gap:10px;padding:12px 20px calc(12px + var(--sb));border-top:1px solid var(--linha);background:var(--branco)}
@media (min-width:380px){.folha-topo,.folha-corpo,.folha-acoes{padding-left:24px;padding-right:24px}}

.peso-mini{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 14px;border-radius:var(--r-sm);background:var(--neutro)}
.peso-mini.fora{background:var(--alerta-bg)}
.peso-mini label{font-size:15px;color:var(--ameixa-70)}
.peso-mini .campo{flex:1;display:flex;align-items:baseline;gap:4px;min-width:0}
.peso-mini input{width:72px;height:40px;border-radius:10px;border:1px solid var(--linha);background:var(--branco);text-align:center;font-size:17px;font-weight:600;outline:0;font-variant-numeric:tabular-nums}
.peso-mini input:focus{border-color:var(--traco)}
.peso-mini.fora input{border-color:var(--alerta);color:var(--alerta)}
.peso-mini .un{font-size:15px;font-weight:600}

/* resultado: o que o cálculo deu (A5) */
.painel{position:relative;overflow:hidden;border-radius:18px;background:var(--nevoa)}
.painel .arco{position:absolute;right:-96px;top:-92px;width:220px;height:220px;color:var(--traco);pointer-events:none}
@media (max-width:359px){.painel .arco{right:-130px;top:-110px}}
.painel-dose{position:relative;padding:16px 16px 14px}
.res-lbl{font-size:14px;font-weight:600;color:var(--ameixa-70)}
.res-num{display:flex;align-items:baseline;gap:8px;margin-top:4px;flex-wrap:wrap}
.res-num b{font-size:clamp(52px,16vw,72px);font-weight:600;line-height:.95;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.res-num span{font-size:24px;font-weight:600;color:var(--vinho)}
.equiv{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:12px;margin-top:14px}
.equiv small{display:block;font-size:13px;font-weight:500;color:var(--ameixa-70)}
.equiv b{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.painel-sec{padding:12px 16px;border-top:1px solid var(--suave)}
.freq{display:flex;align-items:center;gap:8px;font-size:16px}
.freq svg{color:var(--vinho)}
.dia{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.dia .vals{display:flex;gap:14px;flex-wrap:wrap;justify-content:flex-end}
.dia b{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.dia-nota{font-size:14px;color:var(--ameixa-70);margin-top:4px;line-height:1.45}
.fixa{display:flex;gap:10px;align-items:flex-start;padding:16px;border-radius:18px;background:var(--nevoa);font-size:18px;font-weight:600;line-height:1.4}
.fixa svg{color:var(--vinho);margin-top:3px}
.sem-peso{padding:20px 16px;border-radius:var(--r-sm);border:1.5px dashed var(--suave);text-align:center;color:var(--ameixa-70);font-size:16px}

/* avisos do cálculo: gerados pelo app (A5) */
.avisos{display:flex;flex-direction:column;gap:8px}
.aviso{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:var(--r-sm);font-size:15px;line-height:1.45}
.aviso strong{font-weight:600}
.aviso.alerta{background:var(--alerta-bg);color:var(--alerta)}
.aviso.atencao{background:var(--atencao-bg);color:var(--atencao)}
.aviso.info{background:var(--info-bg);color:var(--info)}
.aviso svg{margin-top:1px}

/* orientação clínica: texto da tabela, separado do resultado (A5) */
.orient{border-radius:var(--r-sm);box-shadow:inset 0 0 0 1px var(--linha);padding:12px 14px}
.orient-cab{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.orient-cab h3{font-size:14px;font-weight:600;color:var(--ameixa-70)}
.nivel{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;padding:3px 9px 3px 7px;border-radius:999px;background:var(--neutro);color:var(--ameixa)}
.nivel.alerta{background:var(--alerta-bg);color:var(--alerta)}
.nivel.atencao{background:var(--atencao-bg);color:var(--atencao)}
.nivel.info{background:var(--info-bg);color:var(--info)}
.orient p{font-size:15px;line-height:1.5}
.orient.alerta{box-shadow:inset 0 0 0 1.5px var(--alerta)}

.btn{flex:1;min-width:0;height:52px;border-radius:var(--r-sm);background:var(--vinho);color:#fff;font-size:16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .15s,color .15s;white-space:nowrap}
.btn:active{background:var(--vinho-press)}
.btn:disabled{background:var(--linha);color:var(--ameixa-70);cursor:not-allowed}
.btn.feito{background:var(--nevoa);color:var(--vinho);box-shadow:inset 0 0 0 1.5px var(--vinho)}
.btn.sec{flex:0 0 auto;padding:0 16px;background:var(--branco);color:var(--vinho);box-shadow:inset 0 0 0 1px var(--suave)}
.btn.sec:active{background:var(--nevoa)}
@media (max-width:359px){.btn.sec span{display:none}.btn.sec{width:52px;padding:0}}

/* referência (A5) */
details.calc{border-radius:var(--r-sm);box-shadow:inset 0 0 0 1px var(--linha)}
details.calc summary{list-style:none;cursor:pointer;min-height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:16px;font-weight:600;border-radius:var(--r-sm)}
details.calc summary::-webkit-details-marker{display:none}
details.calc summary svg{color:var(--ameixa-70);transition:transform .2s}
details.calc[open] summary svg{transform:rotate(180deg)}
.calc-corpo{padding:0 14px 14px;display:flex;flex-direction:column;gap:14px}
.calc-corpo h3{font-size:13px;font-weight:600;color:var(--ameixa-70);margin-bottom:2px}
.tabela{display:grid;grid-template-columns:auto 1fr;font-size:15px}
.tabela dt{color:var(--ameixa-70);padding:8px 0;border-top:1px solid var(--linha)}
.tabela dd{text-align:right;font-weight:600;padding:8px 0 8px 12px;border-top:1px solid var(--linha)}
.fonte{display:flex;gap:8px;align-items:flex-start;font-size:15px;color:var(--ameixa-70);line-height:1.5}
.fonte a{color:var(--vinho);font-weight:600;word-break:break-word}
.fonte svg{margin-top:2px}
.nota-final{font-size:14px;color:var(--ameixa-70);text-align:center;line-height:1.5}

@media (min-width:720px){
  .folha{left:50%;right:auto;width:520px;bottom:24px;border-radius:var(--r-lg);transform:translate(-50%,calc(100% + 40px));max-height:calc(100dvh - 48px);overflow:hidden}
  .folha.on{transform:translate(-50%,0)}
  .alca{display:none}
  .folha-topo{padding-top:22px}
}
@media (orientation:landscape) and (max-height:500px){
  .folha{max-height:calc(100dvh - 8px)}
  .folha.on{bottom:4px}
  .res-num b{font-size:52px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
</style>
</head>
<body>

<div class="barra" id="barra" aria-hidden="true">
  <div class="barra-in">
    <button class="barra-peso" type="button" id="barra-peso" tabindex="-1">
      <small id="barra-lbl">Peso da criança</small>
      <b id="barra-valor" class="tab"></b>
    </button>
    <button class="passo p44" type="button" data-passo="-0.5" aria-label="Diminuir 0,5 kg" tabindex="-1"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 12h12"/></svg></button>
    <button class="passo p44" type="button" data-passo="0.5" aria-label="Aumentar 0,5 kg" tabindex="-1"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6v12M6 12h12"/></svg></button>
  </div>
</div>

<div class="app" id="app">

  <header class="perfil">

function calc(med, peso) {
  const p = peso;
  let mgDose=null,mgDia=null,mlDose=null,mlDia=null,gotasDose=null;
  switch(med.id) {
    case 'amoxicilina':     mgDia=p*50; mgDose=mgDia/3; mlDose=mgDose/50; mlDia=mgDia/50; break;
    case 'azitromicina':    mgDia=p*10; mgDose=mgDia/1; mlDose=mgDose/40; mlDia=mgDia/40; break;
    case 'dipirona':        mgDose=p*15; mgDia=mgDose*4; mlDose=mgDose/500; mlDia=mgDia/500; gotasDose=Math.round(mgDose/25); break;
    case 'tramadol':        mgDose=p*1;  mgDia=mgDose*4; mlDose=mgDose/100; mlDia=mgDia/100; gotasDose=Math.round(mgDose/2.5); break;
    case 'nimesulida':      mgDose=p*2.5; mgDia=mgDose*2; mlDose=mgDose/50; mlDia=mgDia/50; gotasDose=Math.round(mgDose/2.5); break;
    case 'dramin':          gotasDose=p; mgDose=gotasDose*1.25; mlDose=gotasDose/20; mgDia=mgDose*3; mlDia=mlDose*3; break;
    case 'ondansetrona':    mgDose=Math.min(p*0.15,8); mgDia=mgDose*1; mlDose=mgDose/0.8; mlDia=mgDia/0.8; break;
    case 'naproxeno':       mgDose=p*6; mgDia=mgDose*2; break;
    case 'amox_clav':       mgDia=p*45; mgDose=Math.min(mgDia/2,875); break;
    case 'cefalexina':      mgDia=p*50; mgDose=mgDia/4; break;
    case 'clindamicina':    mgDia=p*30; mgDose=Math.min(mgDia/3,450); break;
    case 'metronidazol':    mgDose=Math.min(p*10,250); mgDia=mgDose*3; mlDose=mgDose/40; mlDia=mgDia/40; break;
    case 'prednisolona':    mgDose=p*1; mgDia=mgDose*2; mlDose=mgDose/3; mlDia=mgDia/3; break;
    case 'loratadina':      mgDose=Math.min(p*0.2,10); mgDia=mgDose*1; mlDose=mgDose/1; mlDia=mgDia/1; break;
    case 'desloratadina':   mgDose=Math.min(p*0.1,5); mgDia=mgDose*1; mlDose=mgDose/0.5; mlDia=mgDia/0.5; break;
    case 'paracetamol_susp':mgDose=p*15; mgDia=mgDose*5; mlDose=mgDose/32; mlDia=mgDia/32; break;
    case 'paracetamol_gotas':mgDose=p*15; mgDia=mgDose*5; mlDose=mgDose/200; mlDia=mgDia/200; gotasDose=Math.round(mgDose/13.333333); break;
    case 'ibuprofeno_susp': mgDose=Math.min(p*10,800); mgDia=mgDose*4; mlDose=mgDose/20; mlDia=mgDia/20; break;
    case 'ibuprofeno_g50':  mgDose=Math.min(p*10,200); mgDia=mgDose*4; mlDose=mgDose/50; mlDia=mgDia/50; gotasDose=Math.round(mgDose/5); break;
    case 'ibuprofeno_g100': mgDose=Math.min(p*10,200); mgDia=mgDose*4; mlDose=mgDose/100; mlDia=mgDia/100; gotasDose=Math.round(mgDose/10); break;
  }
  return {mgDose,mgDia,mlDose,mlDia,gotasDose};
}

/* o que se mede na prática: gotas > mL > mg */
function principal(v){
  if(v.gtD!==null) return {k:'gtD',n:v.gtD,u:v.gtD===1?'gota':'gotas'};
  if(v.mlD!==null) return {k:'mlD',n:v.mlD,u:'mL'};
  if(v.mgD!==null) return {k:'mgD',n:v.mgD,u:'mg'};
  return null;
}

/* ── SINAIS (só leitura da própria tabela; nada é recalculado) ── */
/* A1: quantas doses a tabela usa no total diário */
function dosesDia(med){
  const s=cfgVal(med,'Doses/dia'); const n=numCfg(s);
  return n?{n,max:/m[áa]x/i.test(s||'')}:null;
}
function txtDoses(d){ return d?`${d.n} ${d.n===1?'dose':'doses'}${d.max?', o máximo':''}`:''; }
function notaDia(med){
  const f=med.freq||'';
  if(/dose única/i.test(f)) return 'Dose única: o total em 24 h é a própria dose.';
  if(/\d\s*[–-]\s*\d+\s*h/.test(f)){ const d=dosesDia(med); return d?`A frequência é um intervalo; o total considera ${txtDoses(d)}, conforme a tabela.`:''; }
  return '';
}
/* limite por dose: a dose ficou igual ao "Máx/dose" da tabela */
function tetoAtingido(med,v){
  const m=cfgVal(med,'Máx/dose'); if(!m||v.mgD===null) return null;
  const teto=numCfg(m);
  return (teto!==null&&v.mgD===teto)?{txt:m,mg:teto}:null;
}
/* A2: limite aplicado na dose, mas o total diário não confere com doses × limite */
function totalSemLimite(med,v){
  const t=tetoAtingido(med,v), d=dosesDia(med);
  if(!t||!d||v.mgDia===null) return null;
  const esperado=fNum(t.mg*d.n,1);
  return Math.abs(esperado-v.mgDia)>0.05?{esperado,d}:null;
}
const concVaria=med=>(cfgVal(med,'Concentração')||'').startsWith('variável');
/* A6: as gotas exibidas diferem de mg ÷ mg por gota (houve arredondamento) */
function gotasArred(med,v){
  if(v.gtD===null||v.mgD===null) return false;
  const mgG=numCfg(cfgVal(med,'mg/gota')); if(!mgG) return false;
  const d=calc(med,lerPeso()); /* valor bruto, antes do arredondamento de exibição */
  return Math.abs(d.mgDose/mgG - d.gotasDose)>0.01;
}
/* avisos do cálculo para um medicamento: [{cls,ico,tit,txt,copia}] */
function avisosCalculo(med,peso){
  const out=[];
  if(foraDaFaixa(peso)) out.push({cls:'alerta',ico:I.tri,tit:'Peso fora da faixa',txt:`${br(peso)} kg está fora de ${PESO_MIN} a ${PESO_MAX} kg. Confira o peso antes de usar a dose.`});
  if(med.fixo||!peso) return out;
  const v=valores(med,peso), t=tetoAtingido(med,v), s=totalSemLimite(med,v);
  if(t) out.push({cls:'atencao',ico:I.ruler,tit:'Limite aplicado',txt:`Dose limitada ao máximo por dose (${t.txt}).`});
  if(s) out.push({cls:'atencao',ico:I.sum,tit:'Total diário sem o limite por dose',txt:`O total em 24 h (${br(v.mgDia)} mg) não considera o limite: ${s.d.n} doses de ${br(t.mg)} mg somariam ${br(s.esperado)} mg. Confira antes de prescrever.`});
  if(concVaria(med)) out.push({cls:'info',ico:I.drop,tit:'Confirmar concentração',txt:'Concentração varia por produto: converta para mL conforme a apresentação usada.'});
  if(gotasArred(med,v)) out.push({cls:'info',ico:I.info,tit:'Gotas arredondadas',txt:'Número de gotas arredondado para o inteiro mais próximo; o valor em mg é o calculado antes do arredondamento.'});
  return out;
}
const htmlAviso=a=>`<div class="aviso ${a.cls}" role="note">${a.ico()}<p><strong>${a.tit}:</strong> ${a.txt}</p></div>`;

/* ── PESO (A4) ── */
function limpaPeso(s){
  s=s.replace(/\./g,',').replace(/[^\d,]/g,'');
  const i=s.indexOf(',');
  if(i>=0) s=s.slice(0,i+1)+s.slice(i+1).replace(/,/g,'').slice(0,1); /* um separador, uma casa decimal */
  const [int,dec]=s.split(',');
  return int.slice(0,3)+(dec!==undefined?','+dec:'');
}
const _ctx=document.createElement('canvas').getContext('2d');
function ajustaLargura(){
  const cs=getComputedStyle($peso);
  _ctx.font=`${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
  $peso.style.width=Math.ceil(_ctx.measureText($peso.value||$peso.placeholder).width)+6+'px';
}
function estadoPeso(){
  const p=lerPeso(), card=$('peso-card'), aj=$('peso-ajuda'), barra=$('barra');
  barra.classList.toggle('fora',foraDaFaixa(p));
  if(!p){ card.dataset.estado='vazio'; aj.innerHTML=I.edit()+'<span>Informe o peso para calcular as doses.</span>'; $('barra-lbl').textContent='Peso da criança'; }
  else if(foraDaFaixa(p)){ card.dataset.estado='fora'; aj.innerHTML=I.tri(18)+`<span>Peso fora da faixa de ${PESO_MIN} a ${PESO_MAX} kg. Confira o valor: as doses abaixo usam ${br(p)} kg.</span>`; $('barra-lbl').textContent='Peso fora da faixa'; }
  else { card.dataset.estado='ok'; aj.innerHTML=I.check()+`<span>Doses calculadas para ${br(p)} kg</span>`; $('barra-lbl').textContent='Peso da criança'; }
  $('barra-valor').className=p?'tab':'vazio';
  $('barra-valor').innerHTML=p?`${br(p)}<span>kg</span>`:'Informe o peso';
}

/* ── LISTA ── */
function renderFiltros(){
  $('filtros').innerHTML=CATS.map(c=>{
    const n=c.id==='todos'?MEDS.length:MEDS.filter(m=>m.cat===c.id).length;
    return `<button class="filtro" type="button" data-cat="${c.id}" aria-pressed="${c.id===catAtiva}">${I.check(16)}${c.lbl}<small class="tab">${n}</small></button>`;
  }).join('');
}
/* B4: realça o termo buscado, ignorando acentos */
function realca(txt,q){
  if(!q) return txt;
  const n=[...txt].map(c=>norm(c)).join('');
  const i=n.indexOf(q); if(i<0) return txt;
  const chars=[...txt];
  return esc(chars.slice(0,i).join(''))+'<mark>'+esc(chars.slice(i,i+q.length).join(''))+'</mark>'+esc(chars.slice(i+q.length).join(''));
}
/* bloco de dados da linha: por dose + em 24 h + frequência e marcas */
function dadosItem(med,peso){
  if(med.fixo) return `<div class="dados fixo"><div class="dados-lbl">Dose fixa</div><div class="txt">${med.dose_fixa}</div>
    <div class="dados-pe"><span class="f">${I.clock(15)}<span>${med.freq}</span></span></div></div>`;
  const v=valores(med,peso), p=principal(v); if(!p) return '';
  const subDose=[];
  if(v.gtD!==null&&p.k!=='gtD') subDose.push(`${br(v.gtD)} gotas`);
  if(v.mlD!==null&&p.k!=='mlD') subDose.push(`${br(v.mlD)} mL`);
  if(v.mgD!==null&&p.k!=='mgD') subDose.push(`${br(v.mgD)} mg`);
  let dPri=null,dSub=[];
  if(v.mlDia!==null){ dPri=[v.mlDia,'mL']; if(v.mgDia!==null) dSub.push(`${br(v.mgDia)} mg`); }
  else if(v.mgDia!==null){ dPri=[v.mgDia,'mg']; }
  const d=dosesDia(med);
  const marcas=[];
  const t=tetoAtingido(med,v);
  if(t) marcas.push(`<span class="marca atencao">${I.ruler(15)}Limite aplicado</span>`);
  if(totalSemLimite(med,v)) marcas.push(`<span class="marca atencao">${I.sum(15)}Total sem limite</span>`);
  if(concVaria(med)) marcas.push(`<span class="marca info">${I.drop(15)}Confirmar concentração</span>`);
  if(gotasArred(med,v)) marcas.push(`<span class="marca info">${I.info(15)}Gotas arredondadas</span>`);
  return `<div class="dados">
    <div class="dados-cols">
      <div class="dados-col"><div class="dados-lbl">Por dose</div>
        <div class="dados-val"><b>${br(p.n)}</b><span>${p.u}</span></div>
        ${subDose.length?`<div class="dados-sub">${subDose.map(x=>`<span>${x}</span>`).join('')}</div>`:''}</div>
      <div class="dados-col d24"><div class="dados-lbl">Em 24 h${d?` · ${d.n} ${d.n===1?'dose':'doses'}`:''}</div>
        ${dPri?`<div class="dados-val"><b>${br(dPri[0])}</b><span>${dPri[1]}</span></div>`:'<div class="dados-val"><b>—</b></div>'}
        ${dSub.length?`<div class="dados-sub">${dSub.map(x=>`<span>${x}</span>`).join('')}</div>`:''}</div>
    </div>
    <div class="dados-pe"><span class="f">${I.clock(15)}<span>${med.freq}</span></span>${marcas.join('')}</div>
  </div>`;
}
function renderLista(){
  const q=norm(termo.trim()), peso=lerPeso();
  const lista=MEDS.filter(m=>(catAtiva==='todos'||m.cat===catAtiva)&&(!q||norm(m.nome).includes(q)||norm(m.apres).includes(q)));
  const cat=CATS.find(c=>c.id===catAtiva);
  /* B4: contagem anunciada */
  $('contagem').innerHTML=q
    ? `<b>${lista.length}</b> ${lista.length===1?'resultado':'resultados'} para “${esc(termo.trim())}”${catAtiva!=='todos'?` em ${cat.lbl}`:''}`
    : `<b>${lista.length}</b> ${lista.length===1?'medicamento':'medicamentos'}${catAtiva!=='todos'?` em ${cat.lbl}`:''}`;
  if(!lista.length){
    $lista.innerHTML=`<div class="vazio">${I.search()}<p>Nenhum medicamento encontrado para “${esc(termo.trim())}”${catAtiva!=='todos'?` em ${cat.lbl}`:''}.</p><button class="btn-sec" type="button" data-reset>Ver todos os medicamentos</button></div>`;
    return;
  }
  /* B2: sem peso, um aviso só e linhas compactas */
  let topo='';
  if(!peso) topo=`<div class="faixa">${I.edit(18)}<span>Informe o peso para ver as doses de cada medicamento.</span></div>`;
  else if(foraDaFaixa(peso)) topo=`<div class="faixa fora">${I.tri(18)}<span>Peso de ${br(peso)} kg fora da faixa de ${PESO_MIN} a ${PESO_MAX} kg. Confira antes de usar qualquer dose.</span></div>`;
  $lista.innerHTML=topo+CATS.filter(c=>c.id!=='todos').map(c=>{
    const itens=lista.filter(m=>m.cat===c.id); if(!itens.length) return '';
    return `<section class="grupo"><h2>${ARCO_MINI}${c.lbl}<small class="tab">${itens.length}</small></h2><ul class="caixa">${itens.map(m=>`
      <li><button class="item" type="button" data-med="${m.id}">
        <div class="item-topo"><div class="item-txt"><div class="item-nome">${realca(m.nome,q)}</div><div class="item-apres">${realca(m.apres,q)}</div>
          ${!peso&&!m.fixo?`<div class="item-freq">${I.clock(15)}<span>${m.freq}</span></div>`:''}</div>${I.chev()}</div>
        ${peso||m.fixo?dadosItem(m,peso):''}
      </button></li>`).join('')}</ul></section>`;
  }).join('');
}

/* ── PAINEL DE RESULTADO ── */
function blocoResultado(med,peso){
  if(med.fixo) return `<div class="fixa">${I.info()}<span>${med.dose_fixa}</span></div><div class="freq">${I.clock(18)}<span>${med.freq}</span></div>`;
  if(!peso) return `<div class="sem-peso">Informe o peso para calcular a dose.</div>`;
  const v=valores(med,peso), p=principal(v), d=dosesDia(med), nota=notaDia(med);
  const eq=[];
  if(v.gtD!==null&&p.k!=='gtD') eq.push(['em gotas',`${br(v.gtD)} gotas`,'gtD']);
  if(v.mgD!==null&&p.k!=='mgD') eq.push(['em mg',`${br(v.mgD)} mg`,'mgD']);
  if(v.mlD!==null&&p.k!=='mlD') eq.push(['em mL',`${br(v.mlD)} mL`,'mlD']);
  const dia=[];
  if(v.mgDia!==null) dia.push(`<b data-k="mgDia">${br(v.mgDia)} mg</b>`);
  if(v.mlDia!==null) dia.push(`<b data-k="mlDia">${br(v.mlDia)} mL</b>`);
  return `<div class="painel" aria-label="Resultado">
      <div class="painel-dose">
        <svg class="arco" viewBox="0 0 100 100" aria-hidden="true"><path d="M85.4 18.6A47 47 0 1 0 85.4 81.4" fill="none" stroke="currentColor" stroke-width=".7" stroke-linecap="round"/></svg>
        <div class="res-lbl">Por dose</div>
        <div class="res-num"><b data-k="${p.k}">${br(p.n)}</b><span>${p.u}</span></div>
        ${eq.length?`<div class="equiv">${eq.map(([l,val,k])=>`<div><small>${l}</small><b data-k="${k}">${val}</b></div>`).join('')}</div>`:''}
      </div>
      <div class="painel-sec"><div class="freq">${I.clock(18)}<span>${med.freq}</span></div></div>
      <div class="painel-sec"><div class="dia"><span class="res-lbl">Total em 24 h${d?` · ${txtDoses(d)}`:''}</span><div class="vals">${dia.join('')||'—'}</div></div>
        ${nota?`<p class="dia-nota">${nota}</p>`:''}</div>
    </div>`;
}
function linkFonte(f){
  if(!f.startsWith('http')) return `<span>${f}</span>`;
  let dom=f; try{ dom=new URL(f).hostname.replace(/^www\./,''); }catch(_){}
  const doc=/\.pdf($|\?)/i.test(f)?'Abrir bula (PDF)':'Abrir documento';
  return `<span><a href="${esc(f)}" target="_blank" rel="noopener">${doc}</a> em ${esc(dom)}</span>`;
}

  const med=MEDS.find(m=>m.id===aberto); if(!med) return;
  const peso=lerPeso(), n=NIVEL[med.obs_tipo]||NIVEL.normal;

        <button class="passo p44" type="button" data-passo="-0.5" aria-label="Diminuir 0,5 kg">${I.minus()}</button>

      </div>`}
      ${blocoResultado(med,peso)}
      ${avisos.length?`<div class="avisos" aria-label="Avisos do cálculo">${avisos.map(htmlAviso).join('')}</div>`:''}
      <section class="orient ${n.cls==='alerta'?'alerta':''}" aria-label="Orientação clínica">
        <div class="orient-cab"><h3>Orientação clínica</h3><span class="nivel ${n.cls}">${n.ico(15)}${n.lbl}</span></div>

          <div><h3>Fonte</h3><p class="fonte">${I.book()}${linkFonte(med.fonte)}</p></div>

    </div>`;
}
/* re-renderiza mantendo foco, rolagem e detalhes abertos */
function atualizarFolha(){
  const foco=document.activeElement&&document.activeElement.id;
  const c=$folha.querySelector('.folha-corpo'), st=c?c.scrollTop:0;
  const d=$folha.querySelector('details.calc'), aberto_=d&&d.open;
  renderFolha();
  const c2=$folha.querySelector('.folha-corpo'); if(c2) c2.scrollTop=st;

  if(foco==='peso2'){ const i=$('peso2'); i.focus(); i.setSelectionRange(i.value.length,i.value.length); }
  anunciarResultado();

/* C2: anuncia o novo resultado ao mudar o peso com o painel aberto */
let tAnuncio;
function anunciarResultado(){
  clearTimeout(tAnuncio);
  tAnuncio=setTimeout(()=>{
    const med=MEDS.find(m=>m.id===aberto), peso=lerPeso(); if(!med||med.fixo) return;
    if(!peso){ $('anuncio').textContent='Informe o peso para calcular a dose.'; return; }
    const p=principal(valores(med,peso));
    $('anuncio').textContent=`${br(p.n)} ${p.u} por dose para ${br(peso)} kg${foraDaFaixa(peso)?', peso fora da faixa':''}.`;
  },500);
}
/* guarda a rolagem ao abrir o painel e devolve ao fechar (Safari/iPhone) */
let rolagem=0;
const $tema=document.querySelector('meta[name="theme-color"]');
function travar(){
  rolagem=window.scrollY;
  document.body.style.top=`-${rolagem}px`;
  document.body.classList.add('travado');
  if($tema) $tema.setAttribute('content','#ABA1A4'); /* off-white sob o véu */
}
function destravar(){
  document.body.classList.remove('travado');
  document.body.style.top='';
  window.scrollTo(0,rolagem);
  if($tema) $tema.setAttribute('content','#FFFAF8');
}
function abrir(id){
  aberto=id; renderFolha();
  $veu.classList.add('on'); $folha.classList.add('on');
  travar(); $app.inert=true; $('barra').inert=true;
  history.pushState({folha:id},'');
  setTimeout(()=>{ const f=$folha.querySelector('[data-fechar]'); f&&f.focus({preventScroll:true}); },60);
}
function fecharUI(){
  if(!aberto) return;
  const id=aberto; aberto=null;
  $veu.classList.remove('on'); $folha.classList.remove('on');
  destravar(); $app.inert=false; $('barra').inert=false;
  const r=document.querySelector(`.item[data-med="${id}"]`); r&&r.focus({preventScroll:true});
}
function fechar(){ if(history.state&&history.state.folha) history.back(); else fecharUI(); }
window.addEventListener('popstate',fecharUI);

/* arrastar a alça para baixo fecha */
(function(){
  let y0=null,dy=0;
  $folha.addEventListener('touchstart',e=>{ if(e.target.closest('#folha-topo')&&!e.target.closest('button')){ y0=e.touches[0].clientY; dy=0; $folha.style.transition='none'; } },{passive:true});
  $folha.addEventListener('touchmove',e=>{ if(y0===null) return; dy=Math.max(0,e.touches[0].clientY-y0); $folha.style.transform=`translateY(${dy}px)`; },{passive:true});
  $folha.addEventListener('touchend',()=>{ if(y0===null) return; $folha.style.transition=''; $folha.style.transform=''; if(dy>90) fechar(); y0=null; });
})();

/* ── COPIAR / COMPARTILHAR (A3): apresentação, unidades, total e avisos ── */
function textoPosologia(med){
  const peso=lerPeso(), L=[med.nome, `Apresentação: ${med.apres}`];
  if(med.fixo){
    L.push(`Dose: ${med.dose_fixa}`, `Frequência: ${med.freq}`);
  } else {
    const v=valores(med,peso), p=principal(v), d=dosesDia(med);
    L.push(`Peso considerado: ${br(peso)} kg`);
    const eq=[];
    if(v.gtD!==null&&p.k!=='gtD') eq.push(`${br(v.gtD)} gotas`);
    if(v.mgD!==null&&p.k!=='mgD') eq.push(`${br(v.mgD)} mg`);
    if(v.mlD!==null&&p.k!=='mlD') eq.push(`${br(v.mlD)} mL`);
    L.push(`Dose: ${br(p.n)} ${p.u}${eq.length?` (${eq.join(' / ')})`:''}`);
    L.push(`Frequência: ${med.freq}`);
    const dia=[]; if(v.mgDia!==null) dia.push(`${br(v.mgDia)} mg`); if(v.mlDia!==null) dia.push(`${br(v.mlDia)} mL`);
    if(dia.length) L.push(`Total em 24 h: ${dia.join(' / ')}${d?` (${txtDoses(d)})`:''}`);
    const nota=notaDia(med); if(nota) L.push(nota);
  }
  avisosCalculo(med,peso).forEach(a=>L.push(`${a.tit}: ${a.txt}`));
  const n=NIVEL[med.obs_tipo]||NIVEL.normal;
  L.push(`Orientação (${n.lbl.toLowerCase()}): ${med.obs}`);
  L.push('Confira bula, concentração, idade e contraindicações antes de prescrever.');
  return L.join('\n');
}
async function copiar(txt){
  try{ await navigator.clipboard.writeText(txt); return true; }
  catch(e){
    const ta=document.createElement('textarea'); ta.value=txt; ta.setAttribute('readonly',''); ta.style.cssText='position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select(); let ok=false; try{ ok=document.execCommand('copy'); }catch(_){} ta.remove(); return ok;
  }
}
let tCopia;
function confirmarCopia(btn,ok){
  btn.classList.toggle('feito',ok);
  btn.innerHTML=ok?`${I.check(20)}<span>Posologia copiada</span>`:`${I.circ(20)}<span>Não foi possível copiar</span>`;
  $('anuncio').textContent=ok?'Posologia copiada':'Não foi possível copiar';
  clearTimeout(tCopia);
  tCopia=setTimeout(()=>{ if(!btn.isConnected) return; btn.classList.remove('feito'); btn.innerHTML=`${I.copy()}<span>Copiar posologia</span>`; },2000);
}

/* ── EVENTOS ── */
function passo(delta){
  const novo=Math.max(0,Math.round((lerPeso()+delta)*10)/10);
  $peso.value=novo?String(novo).replace('.',','):'';
  ajustaLargura(); atualizar();
}
function atualizar(){ estadoPeso(); renderLista(); if(aberto) atualizarFolha(); }

$peso.addEventListener('input',()=>{ const l=limpaPeso($peso.value); if(l!==$peso.value) $peso.value=l; ajustaLargura(); atualizar(); });
$peso.addEventListener('keydown',e=>{ if(e.key==='Enter') $peso.blur(); });
$('peso-valor').addEventListener('click',()=>$peso.focus());
document.addEventListener('click',e=>{
  const s=e.target.closest('[data-passo]');
  if(s&&!s.closest('#folha')) passo(parseFloat(s.dataset.passo));
});
$('barra-peso').addEventListener('click',()=>{ window.scrollTo({top:0,behavior:'smooth'}); setTimeout(()=>$peso.focus({preventScroll:true}),300); });

$busca.addEventListener('input',()=>{ termo=$busca.value; $('limpar').classList.toggle('on',!!termo); renderLista(); });
$busca.addEventListener('keydown',e=>{ if(e.key==='Escape') limparBusca(); if(e.key==='Enter') $busca.blur(); });
function limparBusca(){ $busca.value=''; termo=''; $('limpar').classList.remove('on'); renderLista(); }
$('limpar').addEventListener('click',()=>{ limparBusca(); $busca.focus(); });

$('filtros').addEventListener('click',e=>{
  const b=e.target.closest('.filtro'); if(!b) return;
  catAtiva=b.dataset.cat; renderFiltros(); renderLista();
  const nb=$('filtros').querySelector(`[data-cat="${catAtiva}"]`); nb&&nb.scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'});
});
function fadeFiltros(){ const f=$('filtros'); $('filtros-wrap').classList.toggle('fim',f.scrollLeft+f.clientWidth>=f.scrollWidth-4); }
$('filtros').addEventListener('scroll',fadeFiltros,{passive:true});
window.addEventListener('resize',fadeFiltros);

$lista.addEventListener('click',e=>{
  const r=e.target.closest('[data-med]'); if(r){ abrir(r.dataset.med); return; }
  if(e.target.closest('[data-reset]')){ catAtiva='todos'; renderFiltros(); limparBusca(); }
});
$veu.addEventListener('click',fechar);
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&aberto) fechar(); });
$folha.addEventListener('click',async e=>{
  if(e.target.closest('[data-fechar]')){ fechar(); return; }
  const s=e.target.closest('[data-passo]'); if(s){ passo(parseFloat(s.dataset.passo)); return; }
  const med=MEDS.find(m=>m.id===aberto);
  const c=e.target.closest('[data-copiar]'); if(c){ confirmarCopia(c, await copiar(textoPosologia(med))); return; }
  if(e.target.closest('[data-enviar]')){ try{ await navigator.share({title:med.nome,text:textoPosologia(med)}); }catch(_){} }
});
$folha.addEventListener('input',e=>{
  if(e.target.id!=='peso2') return;
  const l=limpaPeso(e.target.value); e.target.value=l; $peso.value=l; ajustaLargura(); atualizar();
});

/* barra compacta: aparece quando o campo de peso sai da tela */
new IntersectionObserver(([en])=>{
  const on=!en.isIntersecting&&en.boundingClientRect.top<0;
  $('barra').classList.toggle('on',on);
  $('barra').setAttribute('aria-hidden',String(!on));
  $('barra').querySelectorAll('button').forEach(b=>b.tabIndex=on?0:-1);
},{threshold:0}).observe($('peso-card'));

renderFiltros(); ajustaLargura(); atualizar(); fadeFiltros();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ ajustaLargura(); fadeFiltros(); });

/* instalação como app: cache offline (só em https) */
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
